%% The control API is the only central client. It may publish commands and
%% receive validated events/telemetry for the whole fleet.
{allow, {username, "lr-control-api"}, all, ["fleet/#"]}.

%% A robot account must be its robot ID (for example LR-01). It can receive
%% only its command topic and publish only its own events and telemetry.
{allow, {username, {re, "^LR-[A-Za-z0-9_-]+$"}}, subscribe, ["fleet/${username}/command"]}.
{allow, {username, {re, "^LR-[A-Za-z0-9_-]+$"}}, publish, ["fleet/${username}/event", "fleet/${username}/telemetry"]}.

{deny, all}.
