## Production listener configuration. Certificates are mounted at runtime and
## never stored in this repository.
node {
  name = "emqx@127.0.0.1"
  cookie = emqxsecretcookie
  data_dir = data
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
  listeners {
    # Docker publishes this listener only on the control station's loopback
    # address. It must listen on the container interface so local maintenance
    # tools can reach the mapped port without exposing it to the LAN.
    http.bind = "0.0.0.0:18083"
  }
}

listeners.ssl.default {
  bind = 8883
  enable_authn = true
  ssl_options {
    cacertfile = "/opt/emqx/etc/certs/ca.crt"
    certfile = "/opt/emqx/etc/certs/server.crt"
    keyfile = "/opt/emqx/etc/certs/server.key"
    verify = verify_peer
    fail_if_no_peer_cert = true
    versions = [tlsv1.3, tlsv1.2]
  }
}

listeners.tcp.default {
  enable = false
}

listeners.ws.default {
  enable = false
}

listeners.wss.default {
  enable = false
}

authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    enable = true
    user_id_type = username
    password_hash_algorithm {
      name = sha256
      salt_position = suffix
    }
  }
]

authorization {
  no_match = deny
  sources = [
    {
      type = file
      enable = true
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}
