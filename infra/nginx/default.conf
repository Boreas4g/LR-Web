server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://control-api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health {
    proxy_pass http://control-api:8080/health;
  }

  location /docs {
    proxy_pass http://control-api:8080/docs;
  }

  location /redoc {
    proxy_pass http://control-api:8080/redoc;
  }

  location = /openapi.json {
    proxy_pass http://control-api:8080/openapi.json;
  }

  location = /bookarm-api {
    return 308 /bookarm-api/;
  }

  # BookArm stays on the station host and is reachable only through this
  # mounted Unix socket. A missing daemon correctly returns 502 rather than
  # the SPA HTML fallback, making deployment faults observable.
  location /bookarm-api/ {
    proxy_pass http://unix:/run/lr-bookarm/bookarm.sock:/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    # Umi emits route directories; serve their index directly so a route
    # without a trailing slash stays on the configured control-station port.
    try_files $uri/index.html $uri /index.html;
  }
}
