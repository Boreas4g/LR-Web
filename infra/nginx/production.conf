server {
  listen 443 ssl;
  server_name _;

  # The API container can receive a new Docker IP after a restart. Resolve it
  # at request time instead of pinning the address Nginx saw during startup.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $control_api control-api;

  ssl_certificate /etc/nginx/certs/web.crt;
  ssl_certificate_key /etc/nginx/certs/web.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://$control_api:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /health { proxy_pass http://$control_api:8080/health; }
  location /docs { proxy_pass http://$control_api:8080/docs; }
  location /redoc { proxy_pass http://$control_api:8080/redoc; }
  location = /openapi.json { proxy_pass http://$control_api:8080/openapi.json; }

  # The BookArm daemon remains on the station host.  The socket directory is
  # mounted read-only into this container, so neither CAN/serial/camera APIs
  # nor TCP port 8090 are exposed to the LAN.
  location = /bookarm-api { return 308 /bookarm-api/; }

  location /bookarm-api/ {
    proxy_pass http://unix:/run/lr-bookarm/bookarm.sock:/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / { try_files $uri $uri/ /index.html; }
}
