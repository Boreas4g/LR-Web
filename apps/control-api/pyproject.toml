[project]
name = "lr-control-api"
version = "0.1.0"
description = "Central control API for the LR library robot platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "paho-mqtt>=2.1,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "Pillow>=10.4,<12.0",
  "psycopg[binary]>=3.2,<4.0",
  "redis>=5.2,<6.0",
  "SQLAlchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
