auto_localization_node:
  ros__parameters:
    # Local single-machine development default only. Production installation
    # writes /etc/lr-robot/auto-localization.yaml with the approved map ID.
    active_map_id: "MAP-F18C1F27DC2E"
    state_file: "~/.local/state/lr-robot/last_localization.json"
    map_registry_file: ""
    map_min_x: -4.441
    map_max_x: 3.879
    map_min_y: -1.751
    map_max_y: 5.209
    pose_topic: "/amcl_pose"
    initial_pose_topic: "/initialpose"
    status_topic: "/localization/status"
    map_switch_topic: "/localization/map_switch"
    set_initial_pose_service: "/set_initial_pose"
    global_localization_service: "/reinitialize_global_localization"
    nomotion_update_service: "/request_nomotion_update"
    max_saved_pose_age_seconds: 604800.0
    initialization_timeout_seconds: 30.0
    min_stable_samples: 3
    max_position_variance: 0.5
    max_yaw_variance: 0.35
    pose_stale_timeout_seconds: 5.0
    nomotion_update_period_seconds: 1.0
    # Smart seed refinement: after the operator clicks an initial pose, the
    # latest scan is grid-matched against the map in a window around the
    # clicked seed and the best match is republished to AMCL instead.
    smart_seed_enabled: true
    # Minimum occupied-cell hit ratio required to trust a refined seed.
    smart_seed_min_score: 0.25
    # Coarse search window around the clicked seed.
    smart_seed_window_m: 1.5
    smart_seed_step_m: 0.05
    smart_seed_yaw_window_deg: 60.0
    smart_seed_yaw_step_deg: 5.0
    # Fine search window around the coarse winner.
    smart_seed_fine_window_m: 0.1
    smart_seed_fine_step_m: 0.02
    smart_seed_fine_yaw_deg: 6.0
    smart_seed_fine_yaw_step_deg: 2.0
    # One-shot automatic localization (no robot motion): the latest scan is
    # matched against every free cell of the map.  When the best hit ratio
    # reaches smart_seed_min_score the pose is republished to AMCL and
    # confirmed like a manual click; otherwise AMCL global localization is
    # requested and the robot must move to converge.
    auto_localize_service: "/localization/auto_localize"
    # Whole-map coarse search lattice step and yaw increment.
    auto_localize_coarse_step_m: 0.1
    auto_localize_coarse_yaw_step_deg: 45.0
    # Coarse winners refined with the windowed matcher.
    auto_localize_top_k: 5
    # Total time box for the coarse sweep plus refinement; the search is
    # thinned when the map cannot be covered inside the budget.
    auto_localize_time_budget_s: 20.0
    scan_topic: "/scan"
    map_topic: "/map"
